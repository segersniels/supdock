on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v3
        with:
          node-version: "18.x"
      - name: Check formatting and vet
        run: make lint
      - name: Run tests
        run: npm test
      - name: Build
        run: go build ./...

  build:
    needs: verify
    if: github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            exe: amd64-linux
          - goos: linux
            goarch: arm64
            exe: aarch64-linux
          - goos: darwin
            goarch: amd64
            exe: amd64-macos
          - goos: darwin
            goarch: arm64
            exe: aarch64-macos
          - goos: windows
            goarch: amd64
            exe: amd64-windows.exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version-file: go.mod
          cache: true
      - name: Build binary
        run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} make build-release OUTPUT=supdock-${{ matrix.exe }}
      - uses: actions/upload-artifact@v4
        with:
          name: supdock-${{ matrix.exe }}
          path: supdock-${{ matrix.exe }}

  release:
    needs: build
    environment: production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    outputs:
      tag_exists: ${{ steps.check_tag.outputs.exists }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4.1.7
        with:
          pattern: supdock-*
          path: bin
          merge-multiple: true
      - name: Get current package version
        id: current_version
        run: echo "version=$(make version)" >> $GITHUB_OUTPUT
      - uses: mukunku/tag-exists-action@v1.4.0
        id: check_tag
        with:
          tag: "${{ steps.current_version.outputs.version }}"
      - uses: marvinpinto/action-automatic-releases@latest
        if: steps.check_tag.outputs.exists == 'false'
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "${{ steps.current_version.outputs.version }}"
          prerelease: false
          files: ./bin/supdock-*

  npm:
    needs: release
    environment: production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && needs.release.outputs.tag_exists == 'false'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: "18.x"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4.1.7
        with:
          pattern: supdock-*
          path: bin
          merge-multiple: true
      - name: Get current package version
        id: current_version
        run: echo "version=$(make version)" >> $GITHUB_OUTPUT
      - name: Publish to npm
        run: |
          npm version ${{ steps.current_version.outputs.version }} --no-git-tag-version --no-commit-hooks --allow-same-version
          npm publish --provenance --access public
