on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - name: Check formatting and vet
        run: make lint
      - name: Run tests
        run: npm test
      - name: Build
        run: go build ./...

  build:
    needs: verify
    if: github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            exe: linux-amd64
          - goos: linux
            goarch: arm64
            exe: linux-arm64
          - goos: darwin
            goarch: amd64
            exe: darwin-amd64
          - goos: darwin
            goarch: arm64
            exe: darwin-arm64
          - goos: windows
            goarch: amd64
            exe: windows-amd64.exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build binary
        run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} make build-release OUTPUT=supdock-${{ matrix.exe }}
      - uses: actions/upload-artifact@v4
        with:
          name: supdock-${{ matrix.exe }}
          path: supdock-${{ matrix.exe }}

  release:
    needs: build
    environment: production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4.1.7
        with:
          pattern: supdock-*
          path: bin
          merge-multiple: true
      - name: Get current package version
        id: current_version
        run: echo "version=$(make version)" >> $GITHUB_OUTPUT
      - uses: mukunku/tag-exists-action@v1.4.0
        id: check_tag
        with:
          tag: "${{ steps.current_version.outputs.version }}"
      - uses: ncipollo/release-action@v1
        if: steps.check_tag.outputs.exists == 'false'
        with:
          tag: "${{ steps.current_version.outputs.version }}"
          artifacts: "bin/supdock-*"
          generateReleaseNotes: true
          makeLatest: true
          prerelease: false

  npm:
    needs: release
    environment: production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: https://registry.npmjs.org
      - name: Get current package version
        id: current_version
        run: echo "version=$(make version)" >> $GITHUB_OUTPUT
      - name: Check npm package version
        id: check_npm_version
        run: |
          if npm view "supdock@${{ steps.current_version.outputs.version }}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.check_npm_version.outputs.exists == 'false'
        run: |
          npm version ${{ steps.current_version.outputs.version }} --no-git-tag-version --no-commit-hooks --allow-same-version
          npm publish --provenance --access public
